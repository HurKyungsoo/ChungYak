# 배포용 스택 (db + app + caddy). 로컬 개발은 여전히 `./gradlew bootRun` (H2).
#
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#
# Caddy 가 ${DOMAIN} 에 대해 Let's Encrypt 인증서를 자동 발급한다.
# 서버 80/443 포트가 열려 있고 DNS 가 이 서버를 가리켜야 한다.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-chungyak}
      MARIADB_USER: ${DB_USER:-chungyak}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-chungyak}
      DB_USER: ${DB_USER:-chungyak}
      DB_PASSWORD: ${DB_PASSWORD:?}
      PUBLICDATA_SERVICE_KEY: ${PUBLICDATA_SERVICE_KEY:?set PUBLICDATA_SERVICE_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-REPLACE_ME}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
