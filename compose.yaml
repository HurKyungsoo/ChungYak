# 배포용 스택 (db + app + caddy). 로컬 개발은 여전히 `./gradlew bootRun` (H2).
#
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
#
# 외부 공개 방식은 프로필로 고른다 (.env 의 COMPOSE_PROFILES 또는 --profile):
#   caddy        — 서버 80/443 직접 공개. Caddy 가 ${DOMAIN} 인증서 자동 발급.
#   tunnel       — Cloudflare Tunnel (고정 주소). 포트 개방·인증서 불필요. TUNNEL_TOKEN 필요.
#   quick-tunnel — Cloudflare 임시 주소(trycloudflare.com). 계정·도메인 불필요, 재시작마다 주소 변경.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-chungyak}
      MARIADB_USER: ${DB_USER:-chungyak}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-chungyak}
      DB_USER: ${DB_USER:-chungyak}
      DB_PASSWORD: ${DB_PASSWORD:?}
      PUBLICDATA_SERVICE_KEY: ${PUBLICDATA_SERVICE_KEY:?set PUBLICDATA_SERVICE_KEY in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-REPLACE_ME}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # 공개 호스트명 -> http://app:8080 매핑은 Cloudflare 대시보드(Tunnel > Public Hostname)에서 한다.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # 주소는 로그에 찍힌다: docker compose logs cloudflared-quick | grep trycloudflare
    command: tunnel --no-autoupdate --url http://app:8080

volumes:
  db-data:
  caddy-data:
  caddy-config:
