<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('청약나침반 · 일반공급 가점 계산',
    '무주택기간·부양가족수·청약통장 가입기간으로 일반공급 청약가점(만점 84점)을 계산합니다.')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main>
    <h1>일반공급 청약가점 계산</h1>
    <p class="muted">
        무주택 기간(32) + 부양가족 수(35) + 청약통장 가입 기간(17) = <strong>84점 만점</strong>.
        계산은 결정론적이며, 모르는 항목은 비워 두면 "산정 불가"로 표시됩니다(추측하지 않습니다).<br>
        <span class="req-badge">필수</span> 세 항목이 모두 있어야 총점이 나옵니다.
    </p>

    <form method="post" th:action="@{/general-supply}" th:object="${form}">
        <fieldset>
            <legend>기본</legend>
            <label class="field narrow"><span class="lbl">만 나이 <span class="muted">(선택)</span></span>
                <input type="number" min="0" th:field="*{age}" placeholder="예: 34">
            </label>
            <label class="check"><input type="checkbox" th:field="*{married}">
                <span>혼인 중이다 <span class="hint" style="display:inline">— 만 30세 미만 미혼이면 무주택 기간은 0점</span></span></label>
        </fieldset>

        <fieldset>
            <legend>가점 항목</legend>
            <div class="field-grid">
                <label class="field"><span class="lbl">무주택 기간 (개월) <span class="req-badge">필수</span></span>
                    <input type="number" min="0" th:field="*{houselessMonths}" placeholder="예: 60">
                    <span class="hint">만 30세(또는 그 전 혼인 시 혼인신고일)부터 공고일까지 중 무주택인 기간</span>
                </label>
                <label class="field"><span class="lbl">부양가족 수 (본인 제외) <span class="req-badge">필수</span></span>
                    <input type="number" min="0" th:field="*{dependents}" placeholder="예: 2">
                    <span class="hint">배우자 + 동거 직계존속(3년 이상) + 미혼 자녀</span>
                </label>
                <label class="field"><span class="lbl">청약통장 가입 기간 (개월) <span class="req-badge">필수</span></span>
                    <input type="number" min="0" th:field="*{accountMonths}" placeholder="예: 84">
                </label>
            </div>
        </fieldset>

        <!-- 지역 최근 당첨 기록과 비교 (#34, 선택) — 계산에는 쓰지 않는다. 결과 화면에 참고로만 붙는다 -->
        <fieldset>
            <legend>지역 기록과 비교 <span class="muted">(선택)</span></legend>
            <p class="muted" style="margin:2px 0 10px">고르면 결과에 그 지역 최근 민영 분양 공고의 최저 당첨가점과 내 가점을 나란히 보여 드립니다.</p>
            <div class="field-grid">
                <label class="field"><span class="lbl">시도</span>
                    <select th:field="*{region}">
                        <option value="">고르지 않음</option>
                        <option th:each="r : ${regions}" th:value="${r}" th:text="${r}">경기</option>
                    </select>
                </label>
                <label class="field"><span class="lbl">전용면적</span>
                    <select th:field="*{band}">
                        <option th:each="b : ${bands}" th:value="${b}" th:text="${b}"
                                th:selected="${b == '60~85㎡' and form.band == null}">60~85㎡</option>
                    </select>
                </label>
            </div>
        </fieldset>

        <div class="btn-row" style="margin-top:16px;align-items:center">
            <button type="submit" class="btn btn-primary btn-lg">가점 계산</button>
            <span class="form-required" aria-live="polite"></span>
        </div>
    </form>

    <div th:replace="~{fragments/common :: disclaimer}"></div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<script th:replace="~{fragments/common :: requiredFieldsScript}"></script>
</body>
</html>
