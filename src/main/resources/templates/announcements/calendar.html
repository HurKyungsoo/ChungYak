<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('청약나침반 · 청약 캘린더',
    '접수 시작일과 마감일을 월별 캘린더로 한눈에 확인하세요.')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main>
    <a th:href="@{/announcements}" class="backlink">← 공고 목록</a>

    <div class="cal-nav">
        <h2 th:text="${calendar.label}">2026년 9월</h2>
        <div class="nav-btns">
            <a class="btn btn-ghost" th:href="@{/announcements/calendar(month=${calendar.prevMonth})}">‹ 이전달</a>
            <a class="btn btn-ghost" th:if="${!calendar.currentMonth}" th:href="@{/announcements/calendar}">이번달</a>
            <a class="btn btn-ghost" th:href="@{/announcements/calendar(month=${calendar.nextMonth})}">다음달 ›</a>
        </div>
    </div>

    <div class="cal-legend">
        <span><i class="start"></i> 접수 시작</span>
        <span><i class="end"></i> 접수 마감</span>
    </div>

    <div class="cal-grid">
        <div class="cal-dow">일</div>
        <div class="cal-dow">월</div>
        <div class="cal-dow">화</div>
        <div class="cal-dow">수</div>
        <div class="cal-dow">목</div>
        <div class="cal-dow">금</div>
        <div class="cal-dow">토</div>

        <th:block th:each="week : ${calendar.weeks}">
            <div class="cal-day" th:each="day : ${week}"
                 th:classappend="${!day.inMonth} ? 'out' : (${day.today} ? 'today' : '')">
                <span class="num" th:text="${day.date.dayOfMonth}">1</span>
                <!-- 하루 20건씩 몰리는 날이 있어 3건까지만 펼치고 나머지는 접는다(마감 먼저) -->
                <a th:each="ev : ${day.visibleEvents()}" class="cal-event"
                   th:classappend="${ev.kind.name() == 'START'} ? 'start' : 'end'"
                   th:href="@{/announcements/{id}(id=${ev.announcementId})}"
                   th:text="${ev.houseName}"
                   th:title="${(ev.kind.name() == 'START' ? '접수 시작: ' : '접수 마감: ') + ev.houseName}">공고명</a>
                <details class="cal-more" th:if="${!day.hiddenEvents().isEmpty()}">
                    <summary th:text="|+${day.hiddenEvents().size()}개 더|">+5개 더</summary>
                    <a th:each="ev : ${day.hiddenEvents()}" class="cal-event"
                       th:classappend="${ev.kind.name() == 'START'} ? 'start' : 'end'"
                       th:href="@{/announcements/{id}(id=${ev.announcementId})}"
                       th:text="${ev.houseName}"
                       th:title="${(ev.kind.name() == 'START' ? '접수 시작: ' : '접수 마감: ') + ev.houseName}">공고명</a>
                </details>
            </div>
        </th:block>
    </div>

    <!-- 좁은 화면 전용 일정 목록 — 7칸 격자는 공고명이 3~4글자로 잘려 못 읽는다.
         날짜별로 마감 → 시작 순, 공고명을 다 보여 주고 줄 전체를 누를 수 있게 한다. -->
    <div class="cal-agenda">
        <p class="muted" th:if="${calendar.agendaDays().isEmpty()}">이 달에는 남은 접수 일정이 없습니다.</p>
        <section class="agenda-day" th:each="day : ${calendar.agendaDays()}" th:classappend="${day.today} ? 'today' : ''">
            <h3>
                <span th:text="${day.agendaLabel()}">10.12 (월)</span>
                <span class="agenda-today" th:if="${day.today}">오늘</span>
            </h3>
            <ul>
                <li th:each="ev : ${day.endEvents()}">
                    <a class="agenda-item end" th:href="@{/announcements/{id}(id=${ev.announcementId})}">
                        <span class="agenda-kind">마감</span><span class="agenda-name" th:text="${ev.houseName}">공고명</span>
                    </a>
                </li>
                <li th:each="ev : ${day.startEvents()}">
                    <a class="agenda-item start" th:href="@{/announcements/{id}(id=${ev.announcementId})}">
                        <span class="agenda-kind">시작</span><span class="agenda-name" th:text="${ev.houseName}">공고명</span>
                    </a>
                </li>
            </ul>
        </section>
    </div>

    <div th:replace="~{fragments/common :: disclaimer}"></div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
