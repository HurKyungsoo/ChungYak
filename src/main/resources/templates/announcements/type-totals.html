<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 특별공급 유형별 배정 카드 — 청약홈·LH 상세 공용 (DetailHighlights).

     세대수를 아는 공고: 유형별 타일(많은 순) + "이 공고에 없는 유형" 한 줄.
       공고 전체 합계만 보여 준다 — 내 자격은 아래 "내 판정 요약" 한 곳에서 (#46).
     세대수를 모르는 공고(청약홈 신혼희망타운은 총량만, LH 는 유형만 온다): 카드를 숨기지 않는다.
       숨기면 특공이 없는 공고처럼 보인다 — 아는 것(총 세대·있는 유형)만 보여 주고 공고문으로 넘긴다. */-->
<section th:fragment="card(highlights, announcement)" class="card type-totals" aria-label="특별공급 유형별 배정"
         th:if="${!highlights.typeTotals().isEmpty() or highlights.typeCountsUnknown()}">
    <div class="sec-head" style="margin:0 0 10px">
        <h2 style="margin:0">특별공급 유형별 배정</h2>
        <span th:replace="~{fragments/common :: src('data', ${announcement.lh ? 'LH' : '청약홈'})}"></span>
        <span class="count" th:if="${!highlights.typeTotals().isEmpty()}"
              th:text="|주택형 ${announcement.unitTypes.size()}개 합계|">주택형 4개 합계</span>
    </div>

    <th:block th:if="${!highlights.typeTotals().isEmpty()}">
        <div class="type-total-grid">
            <div class="type-total" th:each="t : ${highlights.typeTotals()}" th:attr="data-type=${t.type()}">
                <span class="tt-label" th:text="${t.label()}">신혼부부</span>
                <span class="tt-figure">
                    <strong class="tt-count" th:text="${#numbers.formatInteger(t.count(), 1, 'COMMA')}">48</strong>
                    <span class="tt-share" th:text="${t.sharePercent()} + '%'">26%</span>
                </span>
                <span class="tt-note" th:if="${t.note() != null}" th:text="${t.note()}">기관 추천 필요</span>
            </div>
        </div>
        <!--/* 비율 = 이 공고 특공 중 이 유형의 몫. 세대가 많다고 당첨이 쉽다는 뜻은 아니다(경쟁률 데이터 없음) */-->
        <p class="tt-absent" th:if="${!highlights.absentCommonTypes().isEmpty()}">
            이 공고에 없는 유형:
            <span th:text="${#strings.listJoin(highlights.absentCommonTypes(), ', ')}">청년</span>
        </p>
    </th:block>

    <th:block th:if="${highlights.typeCountsUnknown()}">
        <p class="tt-unknown-total" th:if="${highlights.specialSum() > 0}">
            특별공급 <strong th:text="${#numbers.formatInteger(highlights.specialSum(), 1, 'COMMA')} + '세대'">185세대</strong>
        </p>
        <div class="chips" th:if="${!highlights.presentTypesWithoutCounts().isEmpty()}">
            <span class="chip" th:each="label : ${highlights.presentTypesWithoutCounts()}" th:text="${label}">신혼부부</span>
        </div>
        <p class="muted tt-unknown-note">
            유형별로 나눈 세대수는 원본 데이터에 없어 세지 못했습니다 —
            <a th:if="${announcement.noticePdfUrl != null or announcement.noticeUrl != null}"
               th:href="${announcement.noticePdfUrl} ?: ${announcement.noticeUrl}" target="_blank" rel="noopener">공고문</a><span
                th:unless="${announcement.noticePdfUrl != null or announcement.noticeUrl != null}">공고문</span>에서 확인하세요.
        </p>
    </th:block>
</section>
</body>
</html>
