<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('청약나침반 · 공고 목록')}"></head>
<body>
<div class="wrap">
    <nav th:replace="~{fragments/common :: crumb}"></nav>

    <h1>분양 공고 — 접수중 · 접수예정</h1>
    <p class="muted">청약홈에서 수집한 공고입니다. 공고를 눌러 주택형별 특별공급 물량과 자격 판정을 확인하세요.</p>

    <form class="filter" method="get" th:action="@{/announcements}">
        <select name="region">
            <option value="">지역 전체</option>
            <option th:each="r : ${regions}" th:value="${r}" th:text="${r}"
                    th:selected="${r == selectedRegion}">서울</option>
        </select>
        <select name="detailType">
            <option value="">주택유형 전체</option>
            <option th:each="d : ${detailTypes}" th:if="${d.name() != 'UNKNOWN'}"
                    th:value="${d.name()}" th:text="${d.label}"
                    th:selected="${d == selectedDetailType}">민영</option>
        </select>
        <button type="submit">필터 적용</button>
    </form>

    <p class="muted" th:text="|총 ${rows.size()}건|">총 0건</p>

    <table>
        <thead>
        <tr>
            <th>공고명</th><th>지역</th><th>유형</th><th>접수기간</th>
            <th>상태</th><th>주택형</th><th>특공 세대</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <td><a th:href="@{/announcements/{id}(id=${row.id})}" th:text="${row.houseName}">공고명</a></td>
            <td th:text="${row.regionName} ?: '-'">서울</td>
            <td th:text="${row.houseDetailTypeLabel}">민영</td>
            <td class="muted">
                <span th:text="${row.receptBeginDate} ?: '?'">2026-01-01</span> ~
                <span th:text="${row.receptEndDate} ?: '?'">2026-01-05</span>
            </td>
            <td>
                <span class="tag"
                      th:classappend="${row.status == '접수중'} ? 'open' : (${row.status == '접수예정'} ? 'soon' : 'closed')"
                      th:text="${row.status}">상태</span>
            </td>
            <td th:text="|${row.unitTypeCount}개|">3개</td>
            <td th:text="|${row.totalSpecialSupply}세대|">120세대</td>
        </tr>
        <tr th:if="${rows.isEmpty()}">
            <td colspan="7" class="muted">조건에 맞는 공고가 없습니다. 필터를 바꾸거나 관리자 동기화(<code>POST /api/admin/sync</code>)를 먼저 실행하세요.</td>
        </tr>
        </tbody>
    </table>

    <p th:replace="~{fragments/common :: disclaimer}"></p>
</div>
</body>
</html>
