<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('청약나침반 · 자격 판정')}"></head>
<body>
<div class="wrap">
    <nav th:replace="~{fragments/common :: crumb}"></nav>

    <p class="muted"><a th:href="@{/announcements/{id}(id=${announcement.id})}">← <span th:text="${announcement.houseName}">공고</span></a></p>
    <h1>자격 판정 — 조건 입력</h1>
    <p class="muted">
        입력한 값은 그대로 규칙 엔진에 들어갑니다. 판정은 결정론적이며, 같은 입력이면 항상 같은 결과가 나옵니다.
        모르는 항목은 비워 두면 "판정 불가"로 표시됩니다(추측하지 않습니다).
    </p>

    <!-- 자연어로 물어보기 — LLM 은 폼을 채워주기만 하고 판정에는 관여하지 않습니다. -->
    <fieldset th:if="${extractionAvailable}" style="background:#f0f4ff">
        <legend>자연어로 물어보기 (선택)</legend>
        <p class="muted" style="margin-top:0">
            상황을 문장으로 쓰면 아래 폼을 대신 채워드립니다.
            <strong>채운 값은 판정 전에 직접 확인·수정하세요.</strong>
            AI 는 값만 추출하고 자격 판정에는 전혀 관여하지 않습니다.
        </p>
        <form method="post" th:action="@{/announcements/{id}/eligibility/extract(id=${announcement.id})}">
            <textarea name="naturalText" rows="3" style="width:100%;box-sizing:border-box"
                      placeholder="예: 결혼한 지 3년 됐고 아이가 둘이에요. 청약통장은 2년 넣었고 무주택입니다."
                      th:text="${naturalText}"></textarea>
            <button type="submit">폼 채우기</button>
        </form>
    </fieldset>

    <div th:if="${extraction != null}"
         th:classappend="${extraction.status.name() == 'EXTRACTED'} ? 'banner good' : 'banner bad'"
         class="banner">
        <p style="margin:0" th:text="${extraction.message}">안내</p>
        <ul th:if="${!extraction.unknownFieldLabels.isEmpty()}" style="margin:6px 0 0">
            <li th:each="f : ${extraction.unknownFieldLabels}" th:text="${f}">항목</li>
        </ul>
    </div>

    <form method="post" th:action="@{/announcements/{id}/eligibility(id=${announcement.id})}" th:object="${form}">
        <fieldset>
            <legend>혼인</legend>
            <label class="row"><input type="checkbox" th:field="*{married}"> 혼인 중이다</label>
            <label class="row">혼인신고일로부터 경과 개월 수
                <input type="number" min="0" th:field="*{monthsSinceMarriage}" placeholder="예: 36">
                <span class="muted">(신혼부부 특공은 84개월 이내)</span>
            </label>
        </fieldset>

        <fieldset>
            <legend>자녀</legend>
            <label class="row">미성년 자녀 수
                <input type="number" min="0" th:field="*{childCount}">
            </label>
            <label class="row"><input type="checkbox" th:field="*{hasNewborn}"> 2세 이하 자녀(신생아)가 있다</label>
        </fieldset>

        <fieldset>
            <legend>주택 소유</legend>
            <label class="row"><input type="checkbox" th:field="*{houseless}"> 현재 무주택이다</label>
            <label class="row"><input type="checkbox" th:field="*{everOwnedHouse}"> 과거에 주택을 소유한 적이 있다
                <span class="muted">(생애최초 특공은 소유 이력이 없어야 함)</span>
            </label>
        </fieldset>

        <fieldset>
            <legend>청약통장</legend>
            <label class="row">가입 기간 (개월)
                <input type="number" min="0" th:field="*{accountMonths}" placeholder="예: 12">
                <span class="muted">(비규제 6개월 / 규제지역 24개월)</span>
            </label>
        </fieldset>

        <fieldset>
            <legend>세대</legend>
            <label class="row"><input type="checkbox" th:field="*{householdHead}"> 세대주이다</label>
            <label class="row"><input type="checkbox" th:field="*{supportingOldParents}"> 만 65세 이상 직계존속을 3년 이상 부양 중이다</label>
        </fieldset>

        <button type="submit">판정하기</button>
    </form>

    <p th:replace="~{fragments/common :: disclaimer}"></p>
</div>
</body>
</html>
