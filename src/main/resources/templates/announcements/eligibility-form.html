<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('청약나침반 · 자격 판정')}"></head>
<body>
<header th:replace="~{fragments/common :: header}"></header>

<main>
    <a th:href="@{/announcements/{id}(id=${announcement.id})}" class="backlink">
        ← <span th:text="${announcement.houseName}">공고</span>
    </a>
    <h1>자격 판정 — 조건 입력</h1>
    <p class="muted">
        입력한 값은 그대로 규칙 엔진에 들어갑니다. 같은 입력이면 항상 같은 결과가 나오고,
        모르는 항목은 비워 두면 "판정 불가"로 표시됩니다(추측하지 않습니다).
    </p>

    <!-- 자연어로 물어보기 — LLM 은 폼을 채워주기만 하고 판정에는 관여하지 않습니다 -->
    <fieldset th:if="${extractionAvailable}" class="tint">
        <legend>자연어로 물어보기 <span class="muted">(선택)</span></legend>
        <p class="muted" style="margin-top:2px">
            상황을 문장으로 쓰면 아래 폼을 대신 채워드립니다.
            <strong>채운 값은 판정 전에 직접 확인·수정하세요.</strong> AI 는 값만 추출합니다.
        </p>
        <form method="post" th:action="@{/announcements/{id}/eligibility/extract(id=${announcement.id})}">
            <textarea name="naturalText" rows="3"
                      placeholder="예: 결혼한 지 3년 됐고 아이가 둘이에요. 청약통장은 2년 넣었고 무주택입니다."
                      th:text="${naturalText}"></textarea>
            <div class="btn-row"><button type="submit" class="btn btn-ghost">폼 채우기</button></div>
        </form>
    </fieldset>

    <div th:if="${extraction != null}"
         th:classappend="${extraction.status.name() == 'EXTRACTED'} ? 'banner good' : 'banner bad'"
         class="banner">
        <div>
            <p th:text="${extraction.message}">안내</p>
            <ul th:if="${!extraction.unknownFieldLabels.isEmpty()}">
                <li th:each="f : ${extraction.unknownFieldLabels}" th:text="${f}">항목</li>
            </ul>
        </div>
    </div>

    <form method="post" th:action="@{/announcements/{id}/eligibility(id=${announcement.id})}" th:object="${form}">
        <fieldset>
            <legend>혼인 · 자녀</legend>
            <label class="check"><input type="checkbox" th:field="*{married}"> <span>혼인 중이다</span></label>
            <div class="field-grid">
                <label class="field"><span class="lbl">혼인신고일로부터 경과 개월</span>
                    <input type="number" min="0" th:field="*{monthsSinceMarriage}" placeholder="예: 36">
                    <span class="hint">신혼부부 특공은 84개월 이내</span>
                </label>
                <label class="field"><span class="lbl">미성년 자녀 수</span>
                    <input type="number" min="0" th:field="*{childCount}" placeholder="0">
                </label>
            </div>
            <label class="check"><input type="checkbox" th:field="*{hasNewborn}"> <span>2세 이하 자녀(신생아)가 있다</span></label>
        </fieldset>

        <fieldset>
            <legend>주택 소유</legend>
            <label class="check"><input type="checkbox" th:field="*{houseless}"> <span>현재 무주택이다</span></label>
            <label class="check"><input type="checkbox" th:field="*{everOwnedHouse}">
                <span>과거에 주택을 소유한 적이 있다 <span class="hint" style="display:inline">— 생애최초 특공은 소유 이력이 없어야 함</span></span>
            </label>
        </fieldset>

        <fieldset>
            <legend>청약통장</legend>
            <div class="field-grid">
                <label class="field"><span class="lbl">가입 기간 (개월)</span>
                    <input type="number" min="0" th:field="*{accountMonths}" placeholder="예: 12">
                    <span class="hint">비규제 6개월 / 규제지역 24개월</span>
                </label>
                <label class="field"><span class="lbl">납입 횟수</span>
                    <input type="number" min="0" th:field="*{accountPaymentCount}" placeholder="예: 24">
                    <span class="hint">국민주택 — 12회 이상, 규제지역 24회</span>
                </label>
                <label class="field"><span class="lbl">예치금 (원)</span>
                    <input type="number" min="0" step="100000" th:field="*{accountDeposit}" placeholder="예: 3000000">
                    <span class="hint">민영 — 서울·부산 전용 85㎡ 이하 300만</span>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>세대 · 거주</legend>
            <label class="check"><input type="checkbox" th:field="*{householdHead}"> <span>세대주이다</span></label>
            <label class="check"><input type="checkbox" th:field="*{supportingOldParents}">
                <span>만 65세 이상 직계존속을 3년 이상 부양 중이다</span></label>
            <div class="field-grid">
                <label class="field"><span class="lbl">가구원 수 (본인 포함)</span>
                    <input type="number" min="1" th:field="*{householdSize}" placeholder="예: 3">
                </label>
                <label class="field"><span class="lbl">해당 공급지역 계속 거주 기간 (개월)</span>
                    <input type="number" min="0" th:field="*{residenceMonthsInRegion}" placeholder="예: 24">
                    <span class="hint">투기과열지구 등은 1·2년 이상 거주해야 1순위</span>
                </label>
            </div>
        </fieldset>

        <fieldset>
            <legend>소득 · 자산 <span class="muted">(민영은 소득만, 공공은 자산도)</span></legend>
            <div class="field-grid">
                <label class="field"><span class="lbl">가구 월평균소득 (원, 세전)</span>
                    <input type="number" min="0" step="10000" th:field="*{monthlyHouseholdIncome}" placeholder="예: 6000000">
                </label>
                <label class="field"><span class="lbl">총자산 (원)</span>
                    <input type="number" min="0" step="1000000" th:field="*{totalAssets}" placeholder="예: 300000000">
                    <span class="hint">공공주택 특공만</span>
                </label>
                <label class="field"><span class="lbl">자동차가액 (원)</span>
                    <input type="number" min="0" step="100000" th:field="*{carValue}" placeholder="예: 20000000">
                    <span class="hint">공공주택 특공만</span>
                </label>
            </div>
            <label class="check"><input type="checkbox" th:field="*{dualIncome}">
                <span>맞벌이다 <span class="hint" style="display:inline">— 소득 기준이 완화됨</span></span></label>
        </fieldset>

        <fieldset>
            <legend>재당첨 제한</legend>
            <label class="check"><input type="checkbox" th:field="*{everWonSpecialSupply}">
                <span>과거에 특별공급에 당첨된 적이 있다 (본인/세대원)
                    <span class="hint" style="display:inline">— 특별공급은 세대당 평생 1회</span></span></label>
            <label class="check"><input type="checkbox" th:field="*{pastWinInSpeculationArea}">
                <span>과거 당첨 주택이 투기과열지구·청약과열지역이었다
                    <span class="hint" style="display:inline">— 제한 기간 10년</span></span></label>
            <label class="field" style="max-width:280px"><span class="lbl">마지막 당첨일로부터 경과 개월</span>
                <input type="number" min="0" th:field="*{monthsSinceLastWin}" placeholder="예: 40">
                <span class="hint">당첨 이력이 없으면 비워 두세요</span>
            </label>
        </fieldset>

        <div class="btn-row" style="margin-top:18px">
            <button type="submit" class="btn btn-primary btn-lg">판정하기</button>
        </div>
    </form>

    <div th:replace="~{fragments/common :: disclaimer}"></div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
</body>
</html>
