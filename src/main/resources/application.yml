spring:
  application:
    name: chungyak
  profiles:
    active: local

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 는 엔티티와 스키마가 맞는지 확인만.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 운영 모니터링 — /actuator/health, /actuator/info 만 공개 (SecurityConfig 에서 permitAll)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true          # /actuator/health/liveness, /readiness (수집 상태와 무관)
  info:
    env:
      enabled: true
info:
  app:
    name: 청약나침반
    description: 공공데이터 기반 특별공급 자격 확인

# 공공데이터포털 인증키 - 절대 커밋하지 말 것
publicdata:
  service-key: ${PUBLICDATA_SERVICE_KEY:REPLACE_ME}

  # 한국부동산원 청약홈 (odcloud 게이트웨이)
  applyhome:
    base-url: https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1
    detail-path: /getAPTLttotPblancDetail
    model-path: /getAPTLttotPblancMdl
    per-page: 100
    max-pages: 30

  # 수집 상태 모니터링 (SyncHealthIndicator)
  sync:
    min-expected-records: 1000   # 이 미만이면 이상으로 보고 health DOWN + ERROR 로그
    stale-after-hours: 30        # 마지막 성공 수집이 이보다 오래되면 health DOWN

  # 한국토지주택공사 (data.go.kr B552555 게이트웨이)
  # 활용신청 대상 3종: 목록 15058530 / 상세 15057999 / 공급 15056765 (전부 자동승인)
  # 승인·키 발급 후 PUBLICDATA_SERVICE_KEY 를 넣고 enabled: true 로 켠다
  lh:
    enabled: false
    notice-list-url: https://apis.data.go.kr/B552555/lhLeaseNoticeInfo1/lhLeaseNoticeInfo1
    detail-url: https://apis.data.go.kr/B552555/lhLeaseNoticeDtlInfo1/getLeaseNoticeDtlInfo1
    supply-url: https://apis.data.go.kr/B552555/lhLeaseNoticeSplInfo1/getLeaseNoticeSplInfo1
    per-page: 100
    max-pages: 30
    lookback-months: 6

# LLM (자연어 -> ApplicantProfile 추출, 판정 결과 -> 요약). 절대 커밋하지 말 것.
# ANTHROPIC_API_KEY 가 없으면(=REPLACE_ME) 이 기능만 비활성화되고 나머지는 정상 동작한다.
llm:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:REPLACE_ME}
    model: ${LLM_MODEL:claude-sonnet-5}

# 관리자 계정 (/api/admin/** 보호). 비밀번호를 커밋하지 말 것.
# ADMIN_PASSWORD 가 없으면 기동 시 임시 비밀번호를 생성해 로그에 남긴다.
security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

# 특별공급 소득·자산 요건. 제도 개정으로 자주 바뀜 — 배포 없이 여기만 수정.
# income-limit: 도시근로자 월평균소득 대비 % (single 단독 / dual 맞벌이 완화)
# asset-limit: 원. 공공주택(HOUSE_DTL_SECD=03) 특별공급에만 적용, 민영은 소득만.
special-supply:
  income-limit:
    multi-child:  { single: 120, dual: 120 }
    newlywed:     { single: 140, dual: 160 }
    first-time:   { single: 130, dual: 160 }
    old-parents:  { single: 120, dual: 120 }
    newborn:      { single: 150, dual: 200 }
  asset-limit:
    total-assets: 379000000   # 3.79억
    car-value: 37080000       # 3,708만

# 재당첨 제한 기간 (주택공급규칙 제54조). 개월.
re-win-restriction:
  speculation-area-months: 120   # 투기과열지구·청약과열지역 당첨 10년
  default-months: 60             # 그 외 (보수적으로 수도권 과밀억제권역 5년)

# 청약통장 납입횟수(국민주택)·예치금(민영). 가입 기간과 별개.
account:
  public-min-count: 12           # 국민주택 1순위 납입 횟수 (수도권 기준)
  public-min-count-regulated: 24 # 규제지역
  private-deposit:               # 민영 예치금 (원, 전용 85㎡ 이하 기준)
    tier1: 3000000               # 서울·부산
    tier2: 2500000               # 그 외 광역시
    tier3: 2000000               # 기타 시·군

# 해당 공급지역 거주요건 (계속 거주 기간, 개월)
region-residence:
  regulated-months: 24          # 투기과열지구·청약과열지역 2년
  metro-months: 12              # 수도권(서울·경기·인천) 1년

# 전년도 도시근로자 가구원수별 월평균소득 (통계청). 매년 3월경 갱신 — 배포 없이 여기만 수정.
income-reference:
  basis-year: "2024"
  monthly-average:
    1: 3482964
    2: 5415712
    3: 7198649
    4: 8248467
    5: 8775071
    6: 9563282
    7: 10351493
    8: 11139704

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/chungyak;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chungyak}?characterEncoding=UTF-8
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true
