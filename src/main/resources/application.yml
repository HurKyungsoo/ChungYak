spring:
  application:
    name: chungyak
  profiles:
    active: local

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 는 엔티티와 스키마가 맞는지 확인만.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 운영 모니터링 — /actuator/health, /actuator/info 만 공개 (SecurityConfig 에서 permitAll)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
info:
  app:
    name: 청약나침반
    description: 공공데이터 기반 특별공급 자격 확인

# 공공데이터포털 인증키 - 절대 커밋하지 말 것
publicdata:
  service-key: ${PUBLICDATA_SERVICE_KEY:REPLACE_ME}

  # 한국부동산원 청약홈 (odcloud 게이트웨이)
  applyhome:
    base-url: https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1
    detail-path: /getAPTLttotPblancDetail
    model-path: /getAPTLttotPblancMdl
    per-page: 100
    max-pages: 30

  # 한국토지주택공사 (data.go.kr 게이트웨이) - 목록 API 활용신청 대기 중
  lh:
    enabled: false
    notice-list-url: https://apis.data.go.kr/B552555/lhopendata/lhNoticeList
    detail-url: https://apis.data.go.kr/B552555/lhLeaseNoticeBfhDtlInfo1/getLeaseNoticeBfhDtlInfo1
    supply-url: https://apis.data.go.kr/B552555/lhLeaseNoticeBfhSplInfo1/getLeaseNoticeBfhSplInfo1

# LLM (자연어 -> ApplicantProfile 추출, 판정 결과 -> 요약). 절대 커밋하지 말 것.
# ANTHROPIC_API_KEY 가 없으면(=REPLACE_ME) 이 기능만 비활성화되고 나머지는 정상 동작한다.
llm:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:REPLACE_ME}
    model: ${LLM_MODEL:claude-sonnet-5}

# 관리자 계정 (/api/admin/** 보호). 비밀번호를 커밋하지 말 것.
# ADMIN_PASSWORD 가 없으면 기동 시 임시 비밀번호를 생성해 로그에 남긴다.
security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/chungyak;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chungyak}?characterEncoding=UTF-8
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true
