spring:
  application:
    name: chungyak
  profiles:
    active: local

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 는 엔티티와 스키마가 맞는지 확인만.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 운영 모니터링 — /actuator/health, /actuator/info 만 공개 (SecurityConfig 에서 permitAll)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true          # /actuator/health/liveness, /readiness (수집 상태와 무관)
  info:
    env:
      enabled: true
info:
  app:
    name: 청약나침반
    description: 공공데이터 기반 특별공급 자격 확인

# 공공데이터포털 인증키 - 절대 커밋하지 말 것
publicdata:
  service-key: ${PUBLICDATA_SERVICE_KEY:REPLACE_ME}

  # 한국부동산원 청약홈 (odcloud 게이트웨이)
  applyhome:
    base-url: https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1
    detail-path: /getAPTLttotPblancDetail
    model-path: /getAPTLttotPblancMdl
    # 무순위·잔여세대(줍줍) — 같은 서비스, 최신순 앞 몇 페이지만 수집. 특별공급 판정 대상이 아니다.
    remainder-detail-path: /getRemndrLttotPblancDetail
    remainder-model-path: /getRemndrLttotPblancMdl
    remainder-max-pages: 3
    # 공고문 PDF 원문(#38) — 공식 API 밖(공고 웹페이지의 첨부 링크)이라 끄는 스위치를 둔다. 공고당 한 번, 1초 간격.
    notice-pdf-enabled: ${APPLYHOME_NOTICE_PDF_ENABLED:true}
    notice-request-interval-ms: 1000
    # 특공 유형별 배정·신청 건수(참고 정보, #33) — 같은 키로 data.go.kr 15098905 활용신청 필요
    special-supply-status-url: https://api.odcloud.kr/api/ApplyhomeInfoCmpetRtSvc/v1/getAPTSpsplyReqstStus
    # 당첨가점·경쟁률(참고 정보, #34) — 같은 활용신청. 첫 수집은 전체(가점 3만·경쟁률 5.5만 행 ≈ 86회), 이후 매일 앞 3페이지
    competition-score-url: https://api.odcloud.kr/api/ApplyhomeInfoCmpetRtSvc/v1/getAPTLttotPblancScore
    competition-rate-url: https://api.odcloud.kr/api/ApplyhomeInfoCmpetRtSvc/v1/getAPTLttotPblancCmpet
    competition-sync-pages: 3
    competition-per-page: 1000
    per-page: 100
    max-pages: 30

  # 수집 상태 모니터링 (SyncHealthIndicator)
  sync:
    min-expected-records: 1000   # 이 미만이면 이상으로 보고 health DOWN + ERROR 로그
    stale-after-hours: 30        # 마지막 성공 수집이 이보다 오래되면 health DOWN

  # 한국토지주택공사 (data.go.kr B552555 게이트웨이)
  # 활용신청 대상 3종: 목록 15058530 / 상세 15057999 / 공급 15056765 (전부 자동승인)
  # PUBLICDATA_SERVICE_KEY 가 없으면 LhClient 가 빈 리스트를 반환한다(앱은 정상 기동).
  lh:
    enabled: true
    notice-list-url: https://apis.data.go.kr/B552555/lhLeaseNoticeInfo1/lhLeaseNoticeInfo1
    detail-url: https://apis.data.go.kr/B552555/lhLeaseNoticeDtlInfo1/getLeaseNoticeDtlInfo1
    supply-url: https://apis.data.go.kr/B552555/lhLeaseNoticeSplInfo1/getLeaseNoticeSplInfo1
    per-page: 100
    max-pages: 30
    lookback-months: 6

# LLM (자연어 -> ApplicantProfile 추출, 판정 결과 -> 요약). 절대 커밋하지 말 것.
# ANTHROPIC_API_KEY 가 없으면(=REPLACE_ME) 이 기능만 비활성화되고 나머지는 정상 동작한다.
llm:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:REPLACE_ME}
    model: ${LLM_MODEL:claude-sonnet-5}
  # Groq 무료 등급 대안(OpenAI 호환) — ANTHROPIC_API_KEY 가 없고 GROQ_API_KEY 가 있을 때만 켜진다.
  # explain-enabled 기본 false: 판정 요약 입력에는 소득·자산이 들어가 무료 등급으로 내보내지 않는다(결정론적 요약 사용).
  groq:
    api-key: ${GROQ_API_KEY:REPLACE_ME}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}
    explain-enabled: ${GROQ_EXPLAIN_ENABLED:false}
    # 무료 등급 하루 토큰 한도(200K)는 모델별 — Q&A 를 다른 모델로 돌리면 추출과 한도를 나눠 쓰지 않는다(#32). 비우면 model.
    qa-model: ${GROQ_QA_MODEL:}
    # Q&A 의 gpt-oss 추론 토큰 양(low/medium/high). 비우면 보내지 않는다(Groq 기본값). 추출에는 적용하지 않는다.
    qa-reasoning-effort: ${GROQ_QA_REASONING_EFFORT:}

# 새 공고 알림(C2). 확인·해지 메일의 링크에 쓸 절대 URL 베이스.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  privacy-contact: ${PRIVACY_CONTACT:}   # 개인정보 보호책임자 연락처 — /privacy 에 표시

# 새 공고 알림(C2) 메일 발송. host 가 비어 있으면 JavaMailSender 빈을 안 만들고
# 구독 저장까지만 동작한다(발송은 로그로 대체) — Anthropic/Voyage 키 없을 때와 같은 패턴.
# spring.mail.* 을 직접 안 쓰는 이유: Spring Boot 기본 자동구성은 host 프로퍼티가
# "존재"하기만 해도(빈 문자열이어도) 활성화 조건을 통과해 미설정 시 끄기가 애매하다.
alert:
  from-address: ${ALERT_FROM_ADDRESS:no-reply@chungyak-compass.local}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  deadline-reminder:
    days-before: 3   # 접수마감이 며칠 전인 공고를 알릴지

# 공고문 RAG (의미 검색). Anthropic 은 임베딩 API 가 없어 Voyage AI 를 쓴다.
# VOYAGE_API_KEY 가 없으면(=REPLACE_ME) 인덱싱·검색만 비활성화되고 나머지는 정상 동작한다.
rag:
  voyage:
    api-key: ${VOYAGE_API_KEY:REPLACE_ME}
    model: ${VOYAGE_MODEL:voyage-4-lite}
    base-url: https://api.voyageai.com/v1/embeddings
    batch-size: 64  # 요청당 청크 수. 결제수단 등록(Usage tier 1) 후 16M TPM / 2000 RPM 이라 크게 묶어도 됨
  chunk:
    size: 900        # 청크 목표 길이(문자)
    overlap: 150     # 청크 간 겹침(문자) — 경계 문장 유실 방지
  search:
    top-k: 5
    hybrid-weight: ${RAG_HYBRID_WEIGHT:0.4}   # RRF 벡터(의미) 쪽 가중치, 나머지는 BM25. 0.4: 69문항 eval 49(0.6: 48, BM25 43) — NoticeQaSemanticEvalTest
  rerank:
    # 공고문 Q&A 재정렬(Voyage rerank-2.5, 키는 rag.voyage.api-key). 하이브리드 상위 candidates 개를 다시 매겨 앞쪽만 LLM 에.
    # 69문항 eval: 하이브리드 49 → 후보 8: 56, 12: 59, 20: 61. 질문당 약 1.4만 토큰(무료 2억). 실패하면 하이브리드 순서로 답한다
    enabled: ${RAG_RERANK_ENABLED:true}
    model: ${RAG_RERANK_MODEL:rerank-2.5}
    candidates: ${RAG_RERANK_CANDIDATES:20}
  qa:
    # 답변에 넣을 발췌 개수. 4→2 로 Q&A 토큰 ~3,200→~1,800(#32). 2→3 은 검색 eval(#39, 39문항)에서 정답 발췌가
    # LLM 까지 가는 비율 23→28 — 토큰 ~2,500. 무료 한도(분당 8K·하루 200K)가 빠듯하면 RAG_QA_CONTEXT_CHUNKS=2
    context-chunks: ${RAG_QA_CONTEXT_CHUNKS:3}
    min-score: 0.25          # 최고 발췌 코사인이 이 미만이고
    keyword-min-score: 0.5   # 키워드 겹침도 이 미만이면 "관련 내용 없음" — LLM 호출 생략

# 관리자 계정 (/api/admin/** 보호). 비밀번호를 커밋하지 말 것.
# ADMIN_PASSWORD 가 없으면 기동 시 임시 비밀번호를 생성해 로그에 남긴다.
security:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

# 특별공급 소득·자산 요건. 제도 개정으로 자주 바뀜 — 배포 없이 여기만 수정.
# income-limit: 도시근로자 월평균소득 대비 % (single 단독 / dual 맞벌이 완화)
# asset-limit: 원. 공공주택(HOUSE_DTL_SECD=03) 특별공급에만 적용, 민영은 소득만.
special-supply:
  income-limit:
    multi-child:  { single: 120, dual: 120 }
    newlywed:     { single: 140, dual: 160 }
    first-time:   { single: 130, dual: 160 }
    old-parents:  { single: 120, dual: 120 }
    newborn:      { single: 150, dual: 200 }
    newlywed-hope-town: { single: 130, dual: 200 }   # 표준 신혼부부와 다른 신혼희망타운 전용 기준
  asset-limit:
    total-assets: 379000000   # 3.79억
    car-value: 37080000       # 3,708만

# 신혼희망타운(HOUSE_SECD=10) 전용 자산기준 — 총자산+자동차가액을 하나로 합산해 비교한다
# (위 special-supply.asset-limit 은 표준 공공주택 특공용이라 따로 둔다).
# 출처: myhome.go.kr 신혼희망타운 안내(2026-09-05 확인, "2026년도 적용 기준"). 매년 갱신.
newlywed-hope-town:
  asset-limit: 362000000   # 3억 6,200만원

# 재당첨 제한 기간 (주택공급규칙 제54조). 개월.
re-win-restriction:
  speculation-area-months: 120   # 투기과열지구·청약과열지역 당첨 10년
  default-months: 60             # 그 외 (보수적으로 수도권 과밀억제권역 5년)

# 청약통장 납입횟수(국민주택)·예치금(민영). 가입 기간과 별개.
account:
  public-min-count: 12           # 국민주택 1순위 납입 횟수 (수도권 기준)
  public-min-count-regulated: 24 # 규제지역
  private-deposit:               # 민영 예치금 (원, 전용 85㎡ 이하 기준)
    tier1: 3000000               # 서울·부산
    tier2: 2500000               # 그 외 광역시
    tier3: 2000000               # 기타 시·군

# 해당 공급지역 거주요건 (계속 거주 기간, 개월)
region-residence:
  regulated-months: 24          # 투기과열지구·청약과열지역 2년
  metro-months: 12              # 수도권(서울·경기·인천) 1년

# 민영주택 일반공급 가점제 적용비율(%, 나머지는 추첨제) — 전용면적 구간별, 투기과열지구·
# 청약과열지역 한정(B2b). 그 외 지역은 시장·군수·구청장이 40% 이하에서 정해 공고하므로
# 전국 고정 비율이 없어 여기 안 둔다 — 화면에서 "공고문 확인"으로 안내한다.
# 출처: 주택공급에 관한 규칙 제28조, 국토교통부 정책브리핑 2022-12-14(2023년 시행), 2026-09-17 확인.
general-supply-lottery:
  regulated-point-ratio:
    up-to-60sqm: 40
    up-to-85sqm: 70
    over-85sqm: 80

# 전년도 도시근로자 가구원수별 월평균소득 (통계청). 매년 3월경 갱신 — 배포 없이 여기만 수정.
income-reference:
  basis-year: "2024"
  monthly-average:
    1: 3482964
    2: 5415712
    3: 7198649
    4: 8248467
    5: 8775071
    6: 9563282
    7: 10351493
    8: 11139704

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/chungyak;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  thymeleaf:
    cache: false
# 로컬 기본은 유료 AI(Anthropic·Voyage) 꺼짐 — 셸에 키가 있어도 켜지지 않는다.
# 켜려면 local-ai 프로필을 함께 준다: ./gradlew bootRun --args='--spring.profiles.active=local,local-ai'
# Groq(무료)는 GROQ_API_KEY 환경변수가 있으면 그대로 켜진다.
llm:
  anthropic:
    api-key: REPLACE_ME
rag:
  voyage:
    api-key: REPLACE_ME

---
# 로컬에서 유료 AI 를 명시적으로 켤 때만. 키는 환경변수 또는 gitignore 된 application-local-ai.yml 에.
spring:
  config:
    activate:
      on-profile: local-ai
llm:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:REPLACE_ME}
rag:
  voyage:
    api-key: ${VOYAGE_API_KEY:REPLACE_ME}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chungyak}?characterEncoding=UTF-8
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true
# Caddy 가 HTTPS 를 끝내고 http 로 넘긴다 — X-Forwarded-Proto/Host 를 믿어야 앱이 만드는 절대 주소
# (리다이렉트, .ics 의 공고 링크)가 https 가 된다. native = Tomcat RemoteIpValve: 사설망(도커) 프록시만 신뢰.
server:
  forward-headers-strategy: native
