plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.portfolio'
version = '0.0.1-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // DB 스키마 마이그레이션. H2(로컬·테스트)는 flyway-core, MariaDB(운영)는 flyway-mysql 필요
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // 청약홈은 JSON, LH 는 JSON. XML 은 나중에 소스가 늘면 추가
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // LLM — 자연어 질문 -> ApplicantProfile 추출에만 쓴다 (판정에는 절대 관여하지 않음).
    // Spring AI 가 아니라 공식 Anthropic Java SDK 를 직접 쓴다:
    //  - Spring Boot 버전에 종속되지 않는다 (Spring AI 2.x 는 Boot 4.0 요구)
    //  - output_config.format 스키마 강제로 "애매하면 null" 을 파싱이 아니라 스키마로 보장
    implementation 'com.anthropic:anthropic-java:2.34.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
